<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metaverse Web</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0d1724;
        overflow: hidden;
      }
      #flutter-root {
        width: 100%;
        height: 100%;
      }
      #threejs-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="three-loader.js"></script>
    <script>
      window.addEventListener('load', function () {
        const target = document.getElementById('threejs-canvas');
        if (target && window.initThreeApp) {
          window.initThreeApp(target);
        }
      });
    </script>
  </body>
</html>
