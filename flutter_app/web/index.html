<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Babylon Metaverse</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      #threejs-canvas { width: 100%; height: 100%; display: block; }
      canvas { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <div id="threejs-canvas"></div>
    <script src="https://cdn.jsdelivr.net/npm/babylonjs@7.15.0/babylon.max.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/babylonjs-loaders@7.15.0/babylonjs.loaders.min.js"></script>
    <script src="babylon-loader.js"></script>
    <script>
      window.addEventListener('load', () => {
        const target = document.getElementById('threejs-canvas');
        if (target && window.initBabylonApp) {
          window.initBabylonApp(target);
        }
      });
    </script>
  </body>
</html>
